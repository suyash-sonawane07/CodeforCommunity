services:
  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port
      ${BACKEND_PORT:-8000}"
    container_name: civicpulse-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-mock}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-mock}
      AI_STT_PROVIDER: ${AI_STT_PROVIDER:-mock}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-civicpulse}:${POSTGRES_PASSWORD:-civicpulse}@db:5432/${POSTGRES_DB:-civicpulse}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-mock}
    healthcheck:
      interval: 10s
      retries: 6
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      timeout: 5s
    ports:
    - ${BACKEND_PORT:-8000}:8000
  db:
    container_name: civicpulse-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicpulse}
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-civicpulse} -d ${POSTGRES_DB:-civicpulse}
      timeout: 3s
    image: postgis/postgis:16-3.4
    ports:
    - ${DB_PORT:-5432}:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: civicpulse-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
    - ${FRONTEND_PORT:-3000}:3000
version: '3.9'
volumes:
  pgdata: null
