# Render Infrastructure as Code (Blueprint) Specification
# Deploy with one click on Render: https://render.com/docs/blueprint-spec

databases:
  - name: civicpulse-db
    databaseName: civicpulse
    user: civicpulse
    plan: free
    region: oregon
    ipAllowList: []

services:
  # --------------------------------------------------------------------------
  # CivicPulse Unified Stack (Next.js 14 Frontend + FastAPI + Gemini AI Layer)
  # --------------------------------------------------------------------------
  # Single-URL all-in-one container:
  #   - Public Port: Next.js Google Material Design 3 UI & Copilot (/)
  #   - Internal Port 8000: FastAPI REST API & AI Intelligence Layer
  #   - /docs: Interactive Swagger UI
  #   - /health: Render Liveness & Readiness probe
  # --------------------------------------------------------------------------
  - type: web
    name: civicpulse-app
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civicpulse-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true

      # --- AI Intelligence Layer Settings (PRD §5 & ADR-002) ---
      - key: AI_LLM_PROVIDER
        value: gemini # Options: gemini | mock | openai
      - key: AI_STT_PROVIDER
        value: gemini # Options: gemini | groq | whisper | mock
      - key: AI_EMBEDDING_PROVIDER
        value: gemini # Options: gemini | openai | mock
      - key: GEOCODING_PROVIDER
        value: mock # Options: google | osm | mock
      - key: GEMINI_API_KEY
        sync: false # Set your Google Gemini API key in Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false # Optional: for Groq Whisper transcription
      - key: NEXT_PUBLIC_CARTO_API_KEY
        value: cb1_45dd_1_9ec88189693cc185f0b05713
