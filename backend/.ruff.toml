# Ruff — backend lint + format (line length 100)
line-length = 100
target-version = "py39"

[lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "UP007", # Use Optional[X] for Python 3.9 runtime union safety
    "E501",  # line too long
    "E402",  # module level import
    "UP035", # typing.List
    "UP006", # List -> list
    "F821",  # SQLAlchemy string annotations
]

[lint.per-file-ignores]
# migrations/scripts keep loose style
"migrations/*" = ["E501"]
"scripts/*" = ["E501"]

[format]
quote-style = "double"
indent-style = "space"
